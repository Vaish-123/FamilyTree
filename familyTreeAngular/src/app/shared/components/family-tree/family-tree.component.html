<div class="family-tree">
  @for (level of uniqueLevels; track level) {
    <div class="level">
      @for (member of getMembersByLevel(level); track member; let i = $index) {
        <div class="object-div">
          @if (level!=1) {
            <div class="horizontal-container">
              <div class="horizontal-lineLeft"></div>
              <div class="horizontal-lineRight"></div>
            </div>
          }
          <div class="vertical-line"></div>
          <div class="card-container">
            <div class="card">
              <img [src]="member.photoUrl" alt="{{ member.userName }}" />
              <div class="card-body">
                <h5 class="card-title">{{ member.userName }}</h5>
                <p class="card-text">{{ member.year }}</p>
                <p class="card-relation">{{ member.relationType }}</p>
              </div>
            </div>
          </div>
          @if (member.relationType=='Spouse'&&i != 0) {
            <div class="horizontal-line-right"></div>
          }
          <div class="vertical-line-bottom"></div>
        </div>
      }
    </div>
  }
</div>
